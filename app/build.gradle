plugins {
    id 'com.android.application'
}

android {
    namespace 'com.offlinenotes.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.offlinenotes.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Minimal standard Android libraries
    implementation 'androidx.annotation:annotation:1.7.1'
}
