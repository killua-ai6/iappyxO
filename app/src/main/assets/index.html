<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Notes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>My Notes</h1>
      <button id="new-note-btn" class="btn btn-primary" type="button">+ New Note</button>
    </header>

    <div class="search-container">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 20 20" fill="currentColor" width="18" height="18" aria-hidden="true">
          <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"></path>
        </svg>
        <input 
          type="search" 
          id="search-input" 
          class="search-input" 
          placeholder="Search notes..." 
          autocomplete="off"
        >
      </div>
    </div>

    <main class="app-main">
      <div id="notes-container" class="notes-container">
        <!-- Dynamic list of note cards -->
        <div id="notes-list" class="notes-list"></div>

        <!-- Empty state displayed when no notes exist in storage -->
        <div id="empty-state" class="empty-state">
          <div class="empty-icon">📝</div>
          <p class="empty-text">No notes yet. Create your first note!</p>
        </div>

        <!-- Empty state displayed when search produces zero matches -->
        <div id="no-results-state" class="empty-state hidden">
          <div class="empty-icon">🔍</div>
          <p id="no-results-text" class="empty-text">No matching notes found.</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Note Editor Modal -->
  <div id="note-modal" class="modal-overlay hidden" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modal-title">New Note</h2>
        <button id="cancel-btn-top" class="icon-btn" type="button" aria-label="Close modal">&times;</button>
      </div>

      <form id="note-form">
        <div class="form-group">
          <input 
            type="text" 
            id="note-title-input" 
            class="form-input" 
            placeholder="Title" 
            maxlength="120"
            autocomplete="off"
          >
        </div>

        <div class="form-group">
          <textarea 
            id="note-content-input" 
            class="form-textarea" 
            placeholder="Write your note here..." 
            rows="7"
          ></textarea>
        </div>

        <p id="form-error" class="form-error hidden">Please enter a title or note content.</p>

        <div class="form-actions">
          <button id="delete-btn" type="button" class="btn btn-danger hidden">Delete Note</button>
          <div class="form-actions-right">
            <button id="cancel-btn" type="button" class="btn btn-secondary">Cancel</button>
            <button id="save-btn" type="submit" class="btn btn-primary">Save Note</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
